# Render Blueprint: New > Blueprint > pick this repository.
services:
  - type: web
    name: routone-api
    runtime: docker
    # Whisper + ConvTasNet + librosa need more than the 512 MB of the free/starter plans.
    plan: standard
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ROUTONE_CORS_ORIGINS
        value: https://sudharsanselvaraj.github.io
